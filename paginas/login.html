<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Loja virtual </title>

    <!-- link para favicon-->
    <link rel="shortcut icon" href="../icones/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../css/style_login.css">

</head>

<body>
    <main id="painel">
        <div id="logo">
            <a href="../index.html">
                <img src="../icones/logo.png" alt="logo">
            </a>
        </div>

        <section id="login">
            <label for="email" class="login_email"> Email </label>
            <input type="text" id="email" name="email" class="input_login" placeholder="Digite seu email">

            <label for="senha" class="login_senha"> Senha </label>
            <input type="password" id="senha" name="senha" class="input_login" placeholder="Digite sua senha" maxlength="20">

            <button id="btn_login" type="submit" class="btn_login"> Entrar </button>

            <label for="cadastro" class="login_cadastro"> Não tem uma conta? <a href="../paginas/cadastro.html" class="login_cadastroLnk"> Cadastre-se </a></label>
        </section>
    </main>

</body>
</html>
